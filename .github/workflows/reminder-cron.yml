name: Reminder Cron

on:
  workflow_dispatch:

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Call reminder endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          REMINDER_URL: ${{ secrets.REMINDER_URL || 'https://planner-app-azure.vercel.app/api/send-reminders' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is required."
            exit 1
          fi

          curl --fail --show-error --silent \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$REMINDER_URL"